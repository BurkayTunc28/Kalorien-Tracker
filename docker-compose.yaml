services:
  db:
    image: postgres:16
    container_name: kalorientracker-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: kalorientracker
      POSTGRES_PASSWORD: kalorientracker
      POSTGRES_DB: kalorientracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalorientracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: kalorientracker-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: example
    depends_on:
      - db

volumes:
  pgdata: